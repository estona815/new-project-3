version: 0.2
plugins:
  - id: bertom_denoiser_classic
    name: Bertom Denoiser Classic
    group: core
    category: denoise
    priority: 1
    role: conservative_noise_reduction
    primary_use: reduce steady noise without stripping vocal identity
    chain_role: conservative_denoise
    install_on_public_pc: false
    install_on_main_computer: true
    risk: medium_over_denoise
    fallback: skip denoise or use light ReaEQ/ReaGate only
    public_pc_allowed: false
    main_computer_install: true
    requires_login: unknown
    default_enabled: true
    notes: Use lightly and compare against original.
  - id: tdr_nova
    name: TDR Nova
    group: core
