    chain_role: dynamic_eq
    install_on_public_pc: false
    install_on_main_computer: true
    risk: low_hollowing_if_overused
    fallback: ReaEQ automation
    public_pc_allowed: false
    main_computer_install: true
    requires_login: unknown
    default_enabled: true
    notes: Prefer dynamic EQ when denoise damages the vocal.
